language = "C"
header = "/* Auto-generated by cbindgen. DO NOT EDIT. */"
include_guard = "LIBC12N_CORE_H"
autogen_warning = "/* Generated from c12n-core's extern \"C\" surface. */"
include_version = true
namespace = ""

[export]
include = []
# Rust-only tuning constants. cbindgen emits every `pub const` reachable from
# the crate root, so anything re-exported in lib.rs lands in the C header
# consumed by cgo/PHP FFI and becomes public ABI by accident.
exclude = ["DEFAULT_ESCALATE_THRESHOLD"]

[parse]
parse_deps = false
