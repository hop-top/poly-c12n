language = "C"
header = "/* Auto-generated by cbindgen. DO NOT EDIT. */"
include_guard = "LIBC12N_CORE_H"
autogen_warning = "/* Generated from c12n-core's extern \"C\" surface. */"
include_version = true
namespace = ""

[export]
include = []
# `rt.rs`'s `setTimeout`/`clearTimeout` imports are wasm-bindgen JS bindings
# gated to `wasm32-unknown-unknown`. cbindgen does not evaluate `cfg`, so it
# would otherwise emit them into the C header consumed by cgo/PHP FFI, where
# no such symbols exist.
exclude = ["set_timeout", "clear_timeout"]

[parse]
parse_deps = false
