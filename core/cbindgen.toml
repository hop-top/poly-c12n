language = "C"
header = "/* Auto-generated by cbindgen. DO NOT EDIT. */"
include_guard = "LIBC12N_CORE_H"
autogen_warning = "/* Generated from c12n-core's extern \"C\" surface. */"
include_version = true
namespace = ""

[export]
include = []
# Symbols that must never reach the C header consumed by cgo/PHP FFI:
#
#  - `set_timeout`/`clear_timeout` are wasm-bindgen JS imports gated to
#    `wasm32-unknown-unknown`. cbindgen does not evaluate `cfg`, so it would
#    otherwise emit them where no such symbols exist.
#  - `DEFAULT_ESCALATE_THRESHOLD` is a Rust-only tuning constant. cbindgen
#    emits every `pub const` reachable from the crate root, so anything
#    re-exported in lib.rs becomes public ABI by accident.
exclude = ["set_timeout", "clear_timeout", "DEFAULT_ESCALATE_THRESHOLD"]

[parse]
parse_deps = false
