[package]
name = "hop-top-c12n-core"
version = "0.1.0-alpha.1"
edition = "2021"
build = "build.rs"
description = "c12n classification engine — Rust core with C ABI for cross-language FFI consumers"
license = "MIT"
repository = "https://github.com/hop-top/poly-c12n"
homepage = "https://github.com/hop-top/poly-c12n"
keywords = ["llm", "classification", "routing", "ffi"]
categories = ["api-bindings", "algorithms"]

[lib]
name = "c12n_core"
crate-type = ["lib", "cdylib"]

[features]
default = []
# Enable WebAssembly bindings (consumed by c12n-ts).
# Swaps the multi-threaded tokio runtime for a single-threaded executor
# and exposes a `wasm` module with `#[wasm_bindgen]` types parallel to
# the cgo/PyO3 surface in `ffi.rs`. See ADR-0001.
#
# The clock/timeout shims live in `src/rt.rs` and are selected by target
# arch (not by this feature), so `cargo check --target wasm32-*` behaves
# the same with or without `wasm`.
wasm = [
    "dep:serde-wasm-bindgen",
    "dep:console_error_panic_hook",
]

[dependencies]
async-trait = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Shared (target-agnostic) tokio feature set. `rt-multi-thread` and `time`
# are added only on non-wasm32 targets below.
tokio = { version = "1", features = ["sync", "rt", "macros"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Non-wasm builds (host targets: cgo + PyO3 surfaces) layer on the
# multi-threaded runtime that `ffi.rs` calls `tokio::runtime::Runtime::new()`
# against, plus the `time` driver backing `rt::timeout`. Cargo unions
# features across this section and `[dependencies]`.
#
# `time` is deliberately NOT in the shared set: tokio's timer driver is built
# on `std::time::Instant`, whose `now()` is an `unreachable!()` stub on
# `wasm32-unknown-unknown`. Enabling it there makes `Builder::enable_all()`
# panic at construction time with "time not implemented on this platform".
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

# wasm32 builds replace the tokio timer with `src/rt.rs`'s shims:
# `instant::Instant` (`performance.now()`) for the clock, and a hand-rolled
# `setTimeout` future for `rt::timeout`. Both are unconditional on wasm32 —
# they are what makes the target build at all, independent of the `wasm`
# feature (which only adds the `#[wasm_bindgen]` public surface).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
instant = { version = "0.1", features = ["wasm-bindgen"] }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "core_benchmarks"
harness = false
